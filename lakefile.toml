name = "dirac_cycles"
version = "0.1.0"
defaultTargets = ["MengerHamilton", "DiracCycleLib", "Challenge", "Solution"]
requiresModuleSystem = true

[leanOptions]
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "MengerHamilton"
globs = ["MengerHamilton.+"]

[[lean_lib]]
name = "DiracCycleLib"
globs = ["DiracCycleLib.+"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
